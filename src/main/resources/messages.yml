# -------------------- Morte e Inventario --------------------
# placeholders disponiveis: {player}, {killer}, {weapon}, {distance}, {streak}
death-messages:
  default: "<red>{player} <gray>morreu."
  # mensagem por causa (nome do enum DamageCause do Bukkit) quando NAO foi PVP - causa
  # sem entrada aqui cai no "default" acima.
  causes:
    FALL: "<red>{player} <gray>bateu com tudo no chao e morreu."
    FIRE: "<red>{player} <gray>foi reduzido a cinzas."
    FIRE_TICK: "<red>{player} <gray>queimou ate a morte."
    LAVA: "<red>{player} <gray>tentou nadar em lava."
    DROWNING: "<red>{player} <gray>se afogou."
    VOID: "<red>{player} <gray>caiu no vazio."
    SUFFOCATION: "<red>{player} <gray>sufocou dentro de um bloco."
    STARVATION: "<red>{player} <gray>morreu de fome."
    POISON: "<red>{player} <gray>morreu envenenado."
    MAGIC: "<red>{player} <gray>morreu por magia."
    WITHER: "<red>{player} <gray>definhou e morreu."
    LIGHTNING: "<red>{player} <gray>foi atingido por um raio."
    FALLING_BLOCK: "<red>{player} <gray>foi esmagado por um bloco."
    BLOCK_EXPLOSION: "<red>{player} <gray>explodiu."
    ENTITY_EXPLOSION: "<red>{player} <gray>explodiu."
    FREEZE: "<red>{player} <gray>congelou ate a morte."
    HOT_FLOOR: "<red>{player} <gray>pisou em magma."
  # PVP: melee sem arma "de verdade" (mao vazia), melee com arma, ou a distancia
  # (projetil - arco/besta/tridente). {weapon} = item na mao do assassino no momento.
  pvp:
    default: "<red>{player} <gray>foi morto por <red>{killer}<gray>."
    with-weapon: "<red>{player} <gray>foi morto por <red>{killer} <gray>usando <yellow>{weapon}<gray>."
    ranged: "<red>{player} <gray>foi flechado por <red>{killer} <gray>a <yellow>{distance} <gray>blocos de distancia."
  killstreak:
    milestone: "<dark_red><bold>⚔ <gray>{killer} <gray>esta numa sequencia de <gold>{streak} <gray>mortes!"
    ended: "<gray>A sequencia de <gold>{streak} <gray>mortes de <red>{killer} <gray>foi encerrada por <red>{player}<gray>."
death-chest-title: "<gold>Tumulo de {player}"
death-chest-time-left: "<gray>Expira em {time}"
death-chest-expired: "<gray>O tumulo de {player} expirou e os itens foram perdidos."
invrestore-none: "<red>Nenhum inventario salvo para {player}."
invrestore-success: "<green>Inventario de {player} restaurado."
invrestore-offline: "<red>{player} esta offline. Nao e possivel restaurar agora."
invrestore-restored-on-you: "<yellow>Seu inventario de <gold>{when}<yellow> foi restaurado por um administrador."

