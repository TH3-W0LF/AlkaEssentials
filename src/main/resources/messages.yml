# -------------------- Comando base --------------------
alka-reloaded: "<green>AlkaEssentials recarregado."
alka-help:
  - "<gold><bold>AlkaEssentials <gray>v{version}"
  - ""
  - "<gray>/alkaessentials reload <dark_gray>- recarrega todas as configs"
  - "<gray>/scoreboard <dark_gray>- scoreboard / tablist"
  - "<gray>/worldrules <dark_gray>- regras por mundo"
  - "<gray>/afkzone <dark_gray>- zonas AFK"
  - "<gray>/staff <jogador> <dark_gray>- painel de staff"
  - "<gray>/punish <jogador> <dark_gray>- menu de punicao"
afkzone-help:
  - "<gold>/afkzone <aqua>varinha <gray>- selecionar cantos"
  - "<gold>/afkzone criar <nome> <gray>- criar a zona com a selecao"
  - "<gold>/afkzone redefinir <nome> <gray>- atualizar a regiao"
  - "<gold>/afkzone deletar <nome> <gray>- remover a zona"
  - "<gold>/afkzone tp <nome> <gray>- teleportar ate a zona"
  - "<gold>/afkzone reload <gray>- recarregar zones/"
afkzone-wand:
  # Item da varinha de selecao (mesmo padrao da source original: machado de ouro).
  material: GOLDEN_AXE
  name: "<gold>Varinha de Zona AFK"
  lore:
    - "<gray>Clique direito: canto 1"
    - "<gray>Clique esquerdo: canto 2"

# Modelo usado ao criar uma nova zona AFK (zones/<nome>.yml) - tudo editavel.
zone-defaults:
  messages:
    entered: "<yellow>Voce entrou na zona AFK <gold>%zone%<yellow>! Recompensa em <gold>%time%<yellow>."
    left: "<yellow>Voce saiu da zona AFK. Ficou <gold>%time%<yellow>."
    reward:
      - "<yellow>Voce recebeu:"
  in-zone:
    title: "<gold>AFK"
    subtitle: "<yellow>Proxima recompensa em: <gold>%time%"
    actionbar: ""
    bossbar:
      name: "<gold>AFK | <yellow>Proxima recompensa em: <gold>%time%"
      color: RED
      style: NOTCHED_20

