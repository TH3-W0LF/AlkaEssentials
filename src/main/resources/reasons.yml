# ============================================================
# AlkaEssentials - reasons.yml (premium: menu de punicao)
# Tipos de punicao e motivos exibidos no /punish <jogador>.
# Toda string de exibicao usa MiniMessage.
# ============================================================

# Tipos e motivos disponiveis no menu.
types:
  warn:
    name: "<gold>Aviso"
    reasons:
      - "Spam"
      - "Ofensa"
      - "Caps lock"
  kick:
    name: "<yellow>Expulsao"
    reasons:
      - "Ofensa"
      - "Bugs"
  mute:
    name: "<red>Silenciamento"
    reasons:
      - "Spam"
      - "Ofensa"
      - "Flood"
  tempmute:
    name: "<red>Silenciamento temporario"
    reasons:
      - "Spam"
      - "Ofensa"
      - "Flood"
  ban:
    name: "<dark_red>Banimento"
    reasons:
      - "Hack"
      - "Dupe"
      - "Ofensa grave"
  tempban:
    name: "<dark_red>Banimento temporario"
    reasons:
      - "Hack"
      - "Dupe"
      - "Ofensa grave"

# Duracoes oferecidas no menu (ex.: 30m, 1h, 2d). "Permanente" e sempre a opcao extra.
durations:
  - "30m"
  - "1h"
  - "6h"
  - "12h"
  - "1d"
  - "3d"
  - "7d"
