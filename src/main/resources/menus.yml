# ============================================================
# AlkaEssentials - menus.yml
# Titulos, nomes e lores das GUIs, editaveis sem recompilar.
# Placeholders entre {} sao trocados na hora. MiniMessage.
# ============================================================

# ------------------------- GUI de Warps -------------------------
warps:
  title: "<gradient:#FFD700:#FF8C00>Warps"
  glass:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  empty:
    material: RED_STAINED_GLASS_PANE
    name: "<red>Nenhum warp disponivel"
    lore:
      - "<gray>Cadastre warps com /setwarp"
  warp:
    material: ENDER_PEARL
    name: "<gold>{warp}"
    lore:
      - "<gray>Clique para teleportar"

# ------------------------- GUI de Homes -------------------------
homes:
  title: "<gradient:#FFD700:#FF8C00>Suas Homes"
  glass:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  empty:
    material: RED_STAINED_GLASS_PANE
    name: "<red>Voce nao tem homes"
    lore:
      - "<gray>Defina uma com /sethome"
  home:
    material: SPRUCE_DOOR
    name: "<gold>{home}"
    lore:
      - "<gray>Clique para teleportar"
      - "<gray>Shift + clique para apagar"

# ------------------------- GUI de Staff -------------------------
staff:
  title: "<gradient:#FFD700:#FF8C00>Staff - {player}"
  glass:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  clear:
    material: BARREL
    name: "<gold>Limpar Inventario"
    lore:
      - "<gray>Remove todos os itens de {player}"
  ping:
    material: CLOCK
    name: "<gold>Ver Ping"
    lore:
      - "<gray>Latencia de {player}"
  freeze:
    material: ICE
    name: "<aqua>Congelar"
    lore:
      - "<gray>Congela/descongela {player}"
  teleport:
    material: ENDER_PEARL
    name: "<gold>Teleportar"
    lore:
      - "<gray>Vai ate {player}"
  mute:
    material: REDSTONE_TORCH
    name: "<red>Mutar (30m)"
    lore:
      - "<gray>Silencia {player} por 30 minutos"

# ------------------------- GUI de Punição -------------------------
punish:
  title: "<gradient:#FFD700:#FF8C00>Punir {player}"
  glass:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  back:
    material: ARROW
    name: "<gray>Voltar"
  type-icon:
    material: WRITABLE_BOOK
    name: "{type}"
  reason-icon:
    material: PAPER
    name: "<white>{reason}"
  duration-icon:
    material: CLOCK
    name: "<gold>{duration}"
  permanent:
    material: NETHER_STAR
    name: "<white>Permanente"
  cancel:
    material: BARRIER
    name: "<red>Cancelar"
  info:
    material: PAPER
    name: "<gold>Confirmar punicao"
    lore:
      - "<gray>Alvo: <white>{player}"
      - "<red>Tipo: <white>{type}"
      - "<white>Motivo: {reason}"
      - "{duration}"
  confirm:
    material: GREEN_DYE
    name: "<green>Confirmar"

# ------------------------- GUI de Regras do Mundo -------------------------
worldrules:
  select-title: "<gradient:#FFD700:#FF8C00>Regras do Mundo"
  toggle-title: "<gradient:#FFD700:#FF8C00>Regras - {world}"
  glass:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  back:
    material: ARROW
    name: "<gray>Voltar"
  reset:
    material: BARRIER
    name: "<red>Restaurar padrao"
  on-lore:
    - "<green>Ativo"
    - "<gray>Clique para desligar"
  off-lore:
    - "<red>Inativo"
    - "<gray>Clique para ligar"
  rules:
    mobs:
      name: "<gold>Mobs"
      icon: ZOMBIE_HEAD
    animals:
      name: "<yellow>Animais"
      icon: COW_SPAWN_EGG
    zombie-villagers:
      name: "<green>Zumbi-Vilager"
      icon: ZOMBIE_VILLAGER_SPAWN_EGG
    villagers:
      name: "<aqua>Vilagers"
      icon: VILLAGER_SPAWN_EGG
    structures:
      name: "<dark_aqua>Estruturas"
      icon: IRON_GOLEM_SPAWN_EGG
    rain:
      name: "<aqua>Chuva"
      icon: WATER_BUCKET
    gravity:
      name: "<yellow>Gravidade"
      icon: SAND
    fire:
      name: "<gold>Fogo"
      icon: FLINT_AND_STEEL
    leaves:
      name: "<green>Folhas"
      icon: OAK_LEAVES
    hunger:
      name: "<red>Fome"
      icon: COOKED_BEEF
    creeper:
      name: "<green>Creeper"
      icon: CREEPER_HEAD
    tnt:
      name: "<dark_red>TNT"
      icon: TNT
    mob-grief:
      name: "<dark_aqua>Mob-Grief"
      icon: CRACKED_STONE_BRICKS
    phantoms:
      name: "<light_purple>Phantoms"
      icon: PHANTOM_MEMBRANE
  world:
    material: MAP
    name: "<gold>{world}"
    lore:
      - "<gray>Clique para editar as regras"
  time:
    material: CLOCK
    normal:
      name: "<green>Tempo: Normal"
    day:
      name: "<yellow>Tempo: Dia"
    day_locked:
      name: "<gold>Tempo: Travado ☀"
    night:
      name: "<dark_blue>Tempo: Noite"
    night_locked:
      name: "<blue>Tempo: Travado 🌙"
    lore:
      - "<gray>Clique para alternar"

# ------------------------- GUI de Cor do Nick (/namecolor) -------------------------
namecolor:
  title: "<gradient:#FFD700:#FF8C00>Cor do Nick"
  glass:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  preview:
    material: NAME_TAG
  reset-style:
    material: WHITE_DYE
    name: "<white>Resetar Estilo"
    lore:
      - "<gray>Remove bold/italic/underline/etc. do seu nick"
  clear-color:
    material: BARRIER
    name: "<red>Limpar cor"
    lore:
      - "<gray>Remove a cor e o estilo do seu nick"
  style-material: BOOK
  colors:
    - id: red
      tag: "<red>"
      material: RED_DYE
    - id: dark_red
      tag: "<dark_red>"
      material: BROWN_DYE
    - id: gold
      tag: "<gold>"
      material: ORANGE_DYE
    - id: yellow
      tag: "<yellow>"
      material: YELLOW_DYE
    - id: green
      tag: "<green>"
      material: LIME_DYE
    - id: dark_green
      tag: "<dark_green>"
      material: GREEN_DYE
    - id: aqua
      tag: "<aqua>"
      material: LIGHT_BLUE_DYE
    - id: dark_aqua
      tag: "<dark_aqua>"
      material: CYAN_DYE
    - id: blue
      tag: "<blue>"
      material: BLUE_DYE
    - id: dark_blue
      tag: "<dark_blue>"
      material: BLUE_DYE
    - id: light_purple
      tag: "<light_purple>"
      material: MAGENTA_DYE
    - id: dark_purple
      tag: "<dark_purple>"
      material: PURPLE_DYE
    - id: gray
      tag: "<gray>"
      material: LIGHT_GRAY_DYE
    - id: dark_gray
      tag: "<dark_gray>"
      material: GRAY_DYE
    - id: white
      tag: "<white>"
      material: WHITE_DYE
    - id: black
      tag: "<black>"
      material: BLACK_DYE
  styles:
    - id: bold
      tag: "<bold>"
    - id: italic
      tag: "<italic>"
    - id: underline
      tag: "<underline>"
    - id: strikethrough
      tag: "<strikethrough>"
    - id: obfuscated
      tag: "<obfuscated>"

# ------------------------- GUI de InvRestore -------------------------
invrestore:
  history-title: "<gradient:#55AAFF:#FFFFFF>Historico - {player}"
  preview-title: "<gradient:#55AAFF:#FFFFFF>Preview - {player} ({when})"
  glass:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  empty:
    material: RED_STAINED_GLASS_PANE
    name: "<red>Nenhum snapshot salvo"
    lore:
      - "<gray>{player} ainda nao morreu desde que o historico existe"
  snapshot:
    material: CLOCK
    name: "<gold>{when}"
    lore:
      - "<gray>Clique para pre-visualizar antes de restaurar"
  slot-armor:
    material: LEATHER_CHESTPLATE
    name: "<yellow>Armadura/Offhand"
  confirm:
    material: LIME_DYE
    name: "<green><bold>Confirmar restauracao"
    lore:
      - "<gray>Substitui o inventario ATUAL de {player}"
      - "<gray>por este snapshot."
  cancel:
    material: BARRIER
    name: "<red>Voltar"

# ------------------------- GUI de warps de jogador (/pwarps) -------------------------
pwarps:
  glass:
    material: BLUE_STAINED_GLASS_PANE
    name: " "
  empty:
    material: RED_STAINED_GLASS_PANE
    name: "<red>Nenhum warp encontrado"
  warp-icon:
    name: "<gold>{warp} <gray>({owner})"
    lore:
      - "<gray>Categoria: <white>{category}"
      - "<gray>Nota: <gold>{stars} <gray>({votes} avaliacoes)"
      - "<gray>Preco: <white>{price}"
      - " "
      - "<gray>Clique para ver detalhes"
  favorite-marker:
    material: NETHER_STAR
    name: "<yellow>★ Favorito"
  prev-page:
    material: ARROW
    name: "<yellow>Pagina anterior"
  next-page:
    material: ARROW
    name: "<yellow>Proxima pagina"
  back:
    material: BARRIER
    name: "<red>Voltar"
  tab-browse:
    material: COMPASS
    name: "<white>Navegar"
  tab-mine:
    material: CHEST
    name: "<white>Meus Warps"
  tab-favorites:
    material: NETHER_STAR
    name: "<white>Favoritos"
  delete:
    material: TNT
    name: "<red><bold>Apagar warp"
    lore:
      - "<gray>Clique para apagar permanentemente"
  detail:
    teleport:
      material: ENDER_PEARL
      name: "<green><bold>Teleportar"
      lore:
        - "<gray>Preco: <white>{price}"
    favorite:
      material: NETHER_STAR
      name: "<yellow>Favoritar/Desfavoritar"
    star:
      material: YELLOW_DYE
      name: "<gold>{n} estrela(s)"
      lore:
        - "<gray>Clique para avaliar"
