# Tablist padrao do servidor.
default:
  worlds: []
  permission: ""
  header:
    - ""
    - "<gold><bold>ALKA NETWORK"
    - ""
    - "<gray>Online: <green>%alka_online% <dark_gray>| <gray>Ping: <green>%alka_ping%ms"
    - ""
  footer:
    - ""
    - "<gray>Loja: <aqua>store.alka.com <dark_gray>| <gray>Discord: <aqua>discord.alka.com"
    - ""

