    description: Usa /jump.
    default: op
  alkassentials.qol.condense:
    description: Usa /condense.
    default: true
  alkassentials.qol.smelt:
    description: Usa /smelt.
    default: true
  alkassentials.qol.skull:
    description: Usa /skull.
    default: op
  alkassentials.chat.mutechat:
    description: Usa /mutechat.
    default: op
  alkassentials.chat.mutechat.bypass:
    description: Ignora o mutechat.
    default: op
  alkassentials.signs.colors:
    description: Usa cores nas placas.
    default: op
  alkassentials.showitem.item:
    description: Usa /showitem.
    default: true
  alkassentials.showitem.slot:
    description: Usa /showslot.
    default: true
  alkassentials.showitem.inv:
    description: Usa /showinv.
    default: op
  alkassentials.showitem.ender:
    description: Usa /showender.
    default: op
